name: virology-bioinfo
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
      - pandas>=2.0
      - vcfpy>=0.13
      - matplotlib>=3.7
      - matplotlib-venn>=0.11
      - seaborn>=0.12
      - scipy>=1.11
      - numpy>=1.24
      - ipykernel
      - nbformat
      - nbconvert
